services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: university-ai-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: university-ai-frontend
    ports:
      - "3001:3001"
    environment:
      RAG_API_URL: http://backend:8000
    depends_on:
      - backend